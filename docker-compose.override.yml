# Override для сценария «свой nginx на хосте» (несколько сайтов на одном сервере).
#
# Публикует контейнеры frontend и backend ТОЛЬКО на localhost (127.0.0.1),
# чтобы их не было видно из интернета напрямую — запросы идёт через системный
# nginx хоста, который проксирует домен на эти порты.
#
# Файл подхватывается docker compose автоматически. Для одиночного развёртывания
# (со встроенным nginx-контейнером) он безвреден: порты слушают только localhost.
services:
  frontend:
    ports:
      - "127.0.0.1:3000:3000"
  backend:
    ports:
      - "127.0.0.1:8000:8000"
