# Серверный блок для СИСТЕМНОГО (хостового) nginx — добавляет сайт салона
# рядом с уже работающими сайтами на этом сервере.
#
# Проксирует домен lumieresalon.ru на контейнеры, опубликованные на localhost
# (см. docker-compose.override.yml): frontend :3000, backend :8000.
#
# Это HTTP-версия (порт 80). HTTPS добавит certbot автоматически командой:
#   certbot --nginx -d lumieresalon.ru
#
# Установка на сервере:
#   cp deploy/lumieresalon.ru.conf /etc/nginx/conf.d/
#   nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name lumieresalon.ru;

    client_max_body_size 20m;

    # /api/* → FastAPI backend (префикс /api срезается завершающим слешем).
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;            # потоковый ответ AI-бота (SSE)
        proxy_read_timeout 75s;
    }

    # Всё остальное → Next.js frontend.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 75s;
    }
}
